services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: pandectrun
      POSTGRES_PASSWORD: pandectrun_dev
      POSTGRES_DB: pandectrun
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pandectrun -d pandectrun"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  pgdata:
